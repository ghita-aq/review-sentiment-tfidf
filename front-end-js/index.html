<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Sentiment Classifier</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Review Sentiment Classifier</h1>
            <p class="subtitle">Analyze the sentiment of customer reviews using machine learning</p>
        </header>

        <main>
            <section class="form-section">
                <form id="sentiment-form">
                    <label for="review-text">Enter Customer Review</label>
                    <textarea
                        id="review-text"
                        name="review"
                        placeholder="Type or paste a customer review here..."
                        rows="6"
                        required
                    ></textarea>
                    <div class="form-footer">
                        <span id="char-count">0 characters</span>
                        <button type="submit" id="submit-btn">
                            <span class="btn-text">Analyze Sentiment</span>
                            <span class="btn-loader" hidden>Loading...</span>
                        </button>
                    </div>
                </form>
            </section>

            <section id="result-section" class="result-section" hidden>
                <div class="result-card">
                    <div class="result-header">
                        <h2>Analysis Result</h2>
                        <span id="sentiment-badge" class="badge"></span>
                    </div>
                    <div class="result-body">
                        <div class="confidence-meter">
                            <div class="confidence-label">
                                <span>Confidence</span>
                                <span id="confidence-value">0%</span>
                            </div>
                            <div class="confidence-bar">
                                <div id="confidence-fill" class="confidence-fill"></div>
                            </div>
                        </div>
                        <p class="result-description" id="result-description"></p>
                    </div>
                </div>
            </section>

            <section class="examples-section">
                <h3>Try These Examples</h3>
                <div class="example-buttons">
                    <button class="example-btn positive" data-review="This product is absolutely amazing! Best purchase I've ever made. The quality exceeded all my expectations and the customer service was outstanding.">
                        😊 Positive
                    </button>
                    <button class="example-btn negative" data-review="Terrible experience. The product broke after one day and customer support was unhelpful. Complete waste of money. I would not recommend this to anyone.">
                        😞 Negative
                    </button>
                    <button class="example-btn neutral" data-review="The product is okay. It does what it's supposed to do but nothing more. Average quality for the price.">
                        😐 Neutral
                    </button>
                </div>
            </section>
        </main>

        <footer>
            <p>Powered by TF-IDF &amp; Machine Learning • Built with Django</p>
        </footer>
    </div>

    <div id="error-toast" class="toast" hidden>
        <span class="toast-icon">⚠️</span>
        <span id="error-message"></span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
